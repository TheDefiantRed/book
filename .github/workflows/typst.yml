name: Typst (build + Pages)

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.14.2

      - name: Use commit timestamp as PDF creation date
        run: echo "CREATION_TS=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      # This is the “breakage detector”. If Typst fails, the workflow fails.
      - name: Compile (CI check)
        run: |
          mkdir -p out
          typst compile main.typ out/book.pdf --creation-timestamp "$CREATION_TS"
          typst compile preview.typ out/preview.pdf --creation-timestamp "$CREATION_TS"

      # Only on main: publish a stable PDF via Pages
      - name: Prepare Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp out/book.pdf site/book.pdf
          cp out/preview.pdf site/preview.pdf
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>The Defiant Red</title><p><a href="book.pdf">Download the full book PDF</a></p><p><a href="preview.pdf">Download the preview edition PDF</a></p>' > site/index.html
          touch site/.nojekyll

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4